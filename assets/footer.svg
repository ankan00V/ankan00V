<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img" aria-label="The goal is to turn data into information, and information into insight. — Carly Fiorina">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFFF"/>
      <stop offset="0.5" stop-color="#FF00FF"/>
      <stop offset="1" stop-color="#00FFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFFF"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00FFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    .flicker { animation: flicker 7s infinite; }
    @keyframes flicker { 0%,91%,93%,96%,100% { opacity: 1; } 92%,95% { opacity: .55; } }
    .glitch { animation: glitch 7s infinite; opacity: 0; }
    @keyframes glitch { 0%,90%,97%,100% { opacity: 0; transform: translate(0,0); }
                         91% { opacity: .7; transform: translate(-4px,1px); }
                         93% { opacity: .6; transform: translate(3px,-1px); }
                         95% { opacity: .7; transform: translate(-2px,0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } .glitch { opacity: 0 !important; } }
  </style>

  <rect x="1" y="1" width="958" height="168" rx="14" fill="#07070c"/>
  <rect x="1" y="1" width="958" height="168" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="168" rx="14" fill="none" stroke="url(#edge)" stroke-opacity=".75" stroke-width="1.5"/>
  <path d="M15 1H945A14 14 0 0 1 959 15V36H1V15A14 14 0 0 1 15 1Z" fill="#0f0f18"/>
  <line x1="1" y1="36" x2="959" y2="36" stroke="#00FFFF" stroke-opacity=".18"/>
  <circle cx="24" cy="19" r="6" fill="#FF00FF"/>
  <circle cx="44" cy="19" r="6" fill="#00FFFF"/>
  <circle cx="64" cy="19" r="6" fill="#39FF14"/>
  <text x="480.0" y="23.5" text-anchor="middle" font-size="13" fill="#7a7a92">session — ankan@cyberdeck</text>
  <rect x="2" y="37" width="956" height="3" fill="#00FFFF" opacity=".07">
    <animate attributeName="y" values="37;164;37" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="480.0" y="82" text-anchor="middle" font-size="16" font-style="italic" fill="#e6e6f0">“The goal is to turn data into information, and information into insight.”</text>
  <text x="480.0" y="106" text-anchor="middle" font-size="13" fill="#FF00FF">— Carly Fiorina</text>
  <text x="480.0" y="140" text-anchor="middle" font-size="13"><tspan fill="#39FF14">&gt;</tspan><tspan fill="#7a7a92"> always learning · always building · always shipping  ::  connection closed</tspan><tspan class="blink" fill="#00FFFF"> █</tspan></text>
</svg>
