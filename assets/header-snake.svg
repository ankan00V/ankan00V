<svg xmlns="http://www.w3.org/2000/svg" width="960" height="64" viewBox="0 0 960 64" role="img" aria-label="03 CONTRIB_GRID">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFFF"/>
      <stop offset="0.5" stop-color="#FF00FF"/>
      <stop offset="1" stop-color="#00FFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFFF"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00FFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    .flicker { animation: flicker 7s infinite; }
    @keyframes flicker { 0%,91%,93%,96%,100% { opacity: 1; } 92%,95% { opacity: .55; } }
    .glitch { animation: glitch 7s infinite; opacity: 0; }
    @keyframes glitch { 0%,90%,97%,100% { opacity: 0; transform: translate(0,0); }
                         91% { opacity: .7; transform: translate(-4px,1px); }
                         93% { opacity: .6; transform: translate(3px,-1px); }
                         95% { opacity: .7; transform: translate(-2px,0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } .glitch { opacity: 0 !important; } }
  </style>

  <rect x="1" y="8" width="958" height="48" rx="10" fill="#07070c"/>
  <rect x="1" y="8" width="958" height="48" rx="10" fill="url(#grid)"/>
  <rect x="1" y="8" width="958" height="48" rx="10" fill="none" stroke="url(#edge)" stroke-opacity=".55"/>
  <rect x="1" y="8" width="5" height="48" rx="2" fill="url(#edge)"/>
  <text x="26" y="39" font-size="15" font-weight="700" fill="#FF00FF" filter="url(#glow)">[ 03 ]</text>
  <text x="118" y="39.5" font-size="19" font-weight="700" letter-spacing="2" fill="#00FFFF" filter="url(#glow)">CONTRIB_GRID</text>
  <line x1="300" y1="32" x2="770" y2="32" stroke="#00FFFF" stroke-opacity=".22"/>
  <line x1="300" y1="32" x2="770" y2="32" stroke="url(#neon)" stroke-width="2" stroke-dasharray="60 960">
    <animate attributeName="stroke-dashoffset" values="960;-60" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="934" y="37" text-anchor="end" font-size="13" fill="#7a7a92">// snake.exe<tspan class="blink" fill="#FF00FF"> _</tspan></text>
</svg>
